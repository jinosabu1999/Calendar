<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Calendara — Modern Calendar</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #111118;
            --bg-card: #16161f;
            --bg-card-hover: #1c1c28;
            --bg-glass: rgba(22, 22, 31, 0.7);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-medium: rgba(255, 255, 255, 0.10);
            --text-primary: #f0f0f5;
            --text-secondary: #a0a0b5;
            --text-muted: #5c5c75;
            --accent: #6c5ce7;
            --accent-light: #8b7cf0;
            --accent-glow: rgba(108, 92, 231, 0.3);
            --accent-soft: rgba(108, 92, 231, 0.12);
            --success: #00d2a0;
            --warning: #f5a623;
            --danger: #ff5e5e;
            --pink: #e879a0;
            --cyan: #4dd9c1;
            --orange: #f9a862;
            --gradient-1: linear-gradient(135deg, #6c5ce7 0%, #a78bfa 50%, #c084fc 100%);
            --gradient-2: linear-gradient(135deg, #f97316 0%, #f59e0b 50%, #fbbf24 100%);
            --gradient-3: linear-gradient(135deg, #06b6d4 0%, #22d3ee 50%, #67e8f9 100%);
            --gradient-4: linear-gradient(135deg, #ec4899 0%, #f472b6 50%, #f9a8d4 100%);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-md: 0 8px 32px rgba(0,0,0,0.4);
            --shadow-lg: 0 16px 48px rgba(0,0,0,0.5);
            --shadow-glow: 0 0 40px var(--accent-glow);
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 300ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-spring: 400ms cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 12px;
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(108, 92, 231, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(236, 72, 153, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(6, 182, 212, 0.04) 0%, transparent 50%);
            overflow-x: hidden;
        }

        /* ---- App Shell ---- */
        .app-shell {
            width: 100%;
            max-width: 480px;
            background: var(--bg-secondary);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255,255,255,0.03) inset;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 700px;
            min-height: min(780px, 95dvh);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* ---- Header ---- */
        .app-header {
            padding: 20px 20px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 10;
        }
        .app-logo {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .btn-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border-medium);
            background: var(--bg-card);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition-fast);
            font-size: 1.1rem;
            position: relative;
        }
        .btn-icon:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
            border-color: rgba(255,255,255,0.15);
        }
        .btn-icon:active {
            transform: scale(0.94);
            transition: transform 100ms ease;
        }
        .btn-icon.has-notif::after {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--danger);
            position: absolute;
            top: 8px;
            right: 8px;
            border: 2px solid var(--bg-card);
        }

        /* ---- Month Navigator ---- */
        .month-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 20px 16px;
            flex-shrink: 0;
        }
        .month-title {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text-primary);
        }
        .month-year {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        .nav-arrows {
            display: flex;
            gap: 4px;
        }
        .nav-arrow {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-medium);
            background: var(--bg-card);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition-fast);
            font-size: 1rem;
        }
        .nav-arrow:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }
        .nav-arrow:active {
            transform: scale(0.93);
        }
        .btn-today {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--accent);
            background: var(--accent-soft);
            color: var(--accent-light);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            white-space: nowrap;
            letter-spacing: -0.01em;
        }
        .btn-today:hover {
            background: rgba(108, 92, 231, 0.2);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .btn-today:active {
            transform: scale(0.95);
        }

        /* ---- Calendar Grid ---- */
        .calendar-grid-wrap {
            padding: 0 16px;
            flex-shrink: 0;
        }
        .weekday-row {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            padding: 0 4px 8px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
            padding: 0 4px;
        }
        .day-cell {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all var(--transition-smooth);
            position: relative;
            font-variant-numeric: tabular-nums;
            font-family: 'Inter', sans-serif;
        }
        .day-cell:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }
        .day-cell:active {
            transform: scale(0.88);
            transition: transform 120ms ease;
        }
        .day-cell.other-month {
            color: var(--text-muted);
            opacity: 0.35;
        }
        .day-cell.today {
            background: var(--accent-soft);
            color: var(--accent-light);
            font-weight: 700;
            border: 2px solid var(--accent);
            box-shadow: 0 0 16px var(--accent-glow);
        }
        .day-cell.selected {
            background: var(--accent);
            color: #ffffff;
            font-weight: 700;
            box-shadow: var(--shadow-glow);
            transform: scale(1.05);
            z-index: 2;
        }
        .day-cell.has-event::after {
            content: '';
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent-light);
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
        }
        .day-cell.selected.has-event::after {
            background: #ffffff;
        }
        .day-cell.has-event-multi::after {
            background: linear-gradient(90deg, var(--accent-light) 0%, var(--pink) 50%, var(--cyan) 100%);
            width: 8px;
        }
        .day-cell.weekend {
            color: var(--pink);
            opacity: 0.8;
        }
        .day-cell.weekend.other-month {
            opacity: 0.25;
        }

        /* ---- Mini Timeline / Agenda ---- */
        .agenda-section {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            min-height: 0;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }
        .agenda-section::-webkit-scrollbar {
            width: 3px;
        }
        .agenda-section::-webkit-scrollbar-track {
            background: transparent;
        }
        .agenda-section::-webkit-scrollbar-thumb {
            background: var(--border-medium);
            border-radius: 10px;
        }
        .section-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-subtle);
        }
        .event-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all var(--transition-smooth);
            display: flex;
            gap: 14px;
            align-items: flex-start;
            position: relative;
            overflow: hidden;
        }
        .event-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-medium);
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }
        .event-card:active {
            transform: scale(0.985);
            transition: transform 100ms ease;
        }
        .event-color-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
            margin-top: 4px;
            box-shadow: 0 0 12px currentColor;
        }
        .event-info {
            flex: 1;
            min-width: 0;
        }
        .event-title {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-primary);
            margin-bottom: 2px;
            letter-spacing: -0.01em;
        }
        .event-time {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
            font-family: 'JetBrains Mono', 'SF Mono', monospace;
        }
        .event-meta {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .no-events {
            text-align: center;
            padding: 32px 16px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .no-events-icon {
            font-size: 3rem;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        /* ---- Floating Add Button ---- */
        .fab {
            position: absolute;
            bottom: 24px;
            right: 24px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--gradient-1);
            border: none;
            color: #fff;
            font-size: 1.6rem;
            cursor: pointer;
            box-shadow: 0 8px 28px rgba(108, 92, 231, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-spring);
            z-index: 50;
            font-weight: 300;
            line-height: 1;
        }
        .fab:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 36px rgba(108, 92, 231, 0.55);
        }
        .fab:active {
            transform: scale(0.9);
            transition: transform 120ms ease;
        }

        /* ---- Modal Overlay ---- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 100;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            animation: fadeIn 200ms ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal-sheet {
            width: 100%;
            max-width: 480px;
            background: var(--bg-secondary);
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
            border: 1px solid var(--border-subtle);
            padding: 24px 20px 32px;
            animation: slideUp 350ms cubic-bezier(0.32, 0.72, 0, 1);
            max-height: 85dvh;
            overflow-y: auto;
            box-shadow: 0 -8px 40px rgba(0,0,0,0.5);
        }
        .modal-handle {
            width: 36px;
            height: 4px;
            border-radius: 4px;
            background: var(--border-medium);
            margin: 0 auto 20px;
        }
        .modal-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 18px;
            letter-spacing: -0.01em;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 5px;
            display: block;
        }
        .form-input {
            width: 100%;
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-medium);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            transition: all var(--transition-fast);
            outline: none;
        }
        .form-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        .form-input::placeholder {
            color: var(--text-muted);
        }
        textarea.form-input {
            resize: vertical;
            min-height: 70px;
        }
        .color-picker-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .color-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all var(--transition-fast);
            flex-shrink: 0;
        }
        .color-dot:hover {
            transform: scale(1.15);
        }
        .color-dot.active {
            border-color: var(--text-primary);
            box-shadow: 0 0 16px currentColor;
            transform: scale(1.1);
        }
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all var(--transition-fast);
            letter-spacing: -0.01em;
            border: none;
            font-family: 'Inter', sans-serif;
            flex: 1;
            text-align: center;
        }
        .btn-primary {
            background: var(--gradient-1);
            color: #fff;
            box-shadow: 0 4px 16px var(--accent-glow);
        }
        .btn-primary:hover {
            box-shadow: 0 6px 24px rgba(108, 92, 231, 0.5);
            transform: translateY(-1px);
        }
        .btn-ghost {
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border-medium);
        }
        .btn-ghost:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }
        .btn-danger {
            background: rgba(255, 94, 94, 0.15);
            color: var(--danger);
            border: 1px solid rgba(255, 94, 94, 0.3);
        }
        .btn-danger:hover {
            background: rgba(255, 94, 94, 0.25);
        }
        .btn:active {
            transform: scale(0.96);
            transition: transform 100ms ease;
        }

        /* ---- View Switcher ---- */
        .view-switcher {
            display: flex;
            background: var(--bg-card);
            border-radius: 25px;
            padding: 3px;
            gap: 2px;
            border: 1px solid var(--border-subtle);
        }
        .view-btn {
            padding: 7px 15px;
            border-radius: 22px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-smooth);
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
        }
        .view-btn.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 2px 12px var(--accent-glow);
        }

        /* ---- Week View Grid ---- */
        .week-time-grid {
            display: grid;
            grid-template-columns: 40px 1fr;
            gap: 2px;
            padding: 0 4px;
        }

        /* ---- Toast ---- */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-card);
            border: 1px solid var(--border-medium);
            border-radius: 25px;
            padding: 10px 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-primary);
            box-shadow: var(--shadow-md);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: all 300ms cubic-bezier(0.34, 1.56, 0.64, 1);
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ---- Responsive ---- */
        @media (max-width: 400px) {
            .app-shell {
                border-radius: var(--radius-lg);
                min-height: 0;
            }
            .app-header {
                padding: 14px 14px 8px;
            }
            .calendar-grid-wrap {
                padding: 0 8px;
            }
            .days-grid {
                gap: 1px;
                padding: 0 2px;
            }
            .day-cell {
                font-size: 0.78rem;
                border-radius: 45%;
            }
            .agenda-section {
                padding: 12px 14px;
            }
            .fab {
                width: 46px;
                height: 46px;
                bottom: 18px;
                right: 18px;
                font-size: 1.4rem;
            }
            .modal-sheet {
                padding: 20px 16px 28px;
                border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            }
        }

        @media (min-width: 768px) {
            body {
                padding: 24px;
            }
            .app-shell {
                max-width: 520px;
            }
        }

        /* Dark scrollbar for modal */
        .modal-sheet::-webkit-scrollbar {
            width: 3px;
        }
        .modal-sheet::-webkit-scrollbar-track {
            background: transparent;
        }
        .modal-sheet::-webkit-scrollbar-thumb {
            background: var(--border-medium);
            border-radius: 10px;
        }

        /* Pulse animation for live dot */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .live-dot {
            animation: pulse 2s ease-in-out infinite;
        }

        .search-input-wrap {
            position: relative;
            margin-bottom: 10px;
        }
        .search-input-wrap .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
            pointer-events: none;
        }
        .search-input-wrap .form-input {
            padding-left: 36px;
        }
    </style>
</head>
<body>
    <div class="app-shell" id="appShell">
        <!-- Header -->
        <header class="app-header">
            <div>
                <div class="app-logo">Calendara</div>
            </div>
            <div class="header-actions">
                <div class="view-switcher" id="viewSwitcher">
                    <button class="view-btn active" data-view="month">Month</button>
                    <button class="view-btn" data-view="agenda">Agenda</button>
                </div>
                <button class="btn-icon" id="btnSearch" title="Search" aria-label="Search events">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </button>
            </div>
        </header>

        <!-- Month Navigator -->
        <div class="month-nav">
            <div>
                <div class="month-title" id="monthTitle">January</div>
                <div class="month-year" id="monthYear">2026</div>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
                <button class="btn-today" id="btnToday">Today</button>
                <div class="nav-arrows">
                    <button class="nav-arrow" id="btnPrev" aria-label="Previous month">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                    </button>
                    <button class="nav-arrow" id="btnNext" aria-label="Next month">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Calendar Grid -->
        <div class="calendar-grid-wrap" id="calendarGridWrap">
            <div class="weekday-row">
                <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
            </div>
            <div class="days-grid" id="daysGrid"></div>
        </div>

        <!-- Agenda / Events Section -->
        <div class="agenda-section" id="agendaSection">
            <div class="section-label">Upcoming Events</div>
            <div id="eventsList"></div>
        </div>

        <!-- FAB -->
        <button class="fab" id="fabAdd" aria-label="Add event" title="Add event">+</button>
    </div>

    <!-- Add/Edit Event Modal -->
    <div class="modal-overlay" id="modalOverlay" style="display:none;">
        <div class="modal-sheet" id="modalSheet">
            <div class="modal-handle"></div>
            <div class="modal-title" id="modalTitle">New Event</div>
            <div class="form-group">
                <label class="form-label">Title</label>
                <input type="text" class="form-input" id="inputTitle" placeholder="Event name..." maxlength="80">
            </div>
            <div class="form-group">
                <label class="form-label">Date</label>
                <input type="date" class="form-input" id="inputDate">
            </div>
            <div class="form-group">
                <label class="form-label">Time</label>
                <input type="time" class="form-input" id="inputTime" value="09:00">
            </div>
            <div class="form-group">
                <label class="form-label">Description (optional)</label>
                <textarea class="form-input" id="inputDesc" placeholder="Add notes..." maxlength="200"></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Color</label>
                <div class="color-picker-row" id="colorPicker">
                    <span class="color-dot active" data-color="#6c5ce7" style="background:#6c5ce7;color:#6c5ce7;"></span>
                    <span class="color-dot" data-color="#f97316" style="background:#f97316;color:#f97316;"></span>
                    <span class="color-dot" data-color="#06b6d4" style="background:#06b6d4;color:#06b6d4;"></span>
                    <span class="color-dot" data-color="#ec4899" style="background:#ec4899;color:#ec4899;"></span>
                    <span class="color-dot" data-color="#22c55e" style="background:#22c55e;color:#22c55e;"></span>
                    <span class="color-dot" data-color="#facc15" style="background:#facc15;color:#facc15;"></span>
                </div>
            </div>
            <input type="hidden" id="inputEditId" value="">
            <div class="btn-row">
                <button class="btn btn-ghost" id="btnCancel">Cancel</button>
                <button class="btn btn-danger" id="btnDelete" style="display:none;flex:0.6;">Delete</button>
                <button class="btn btn-primary" id="btnSave">Save Event</button>
            </div>
        </div>
    </div>

    <!-- Search Modal -->
    <div class="modal-overlay" id="searchOverlay" style="display:none;">
        <div class="modal-sheet" id="searchSheet">
            <div class="modal-handle"></div>
            <div class="modal-title">Search Events</div>
            <div class="search-input-wrap">
                <span class="search-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </span>
                <input type="text" class="form-input" id="inputSearch" placeholder="Type to search..." autocomplete="off">
            </div>
            <div id="searchResults" style="max-height:50vh;overflow-y:auto;"></div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            // ---- State ----
            let currentDate = new Date();
            let selectedDate = new Date();
            let currentView = 'month'; // 'month' | 'agenda'
            let events = [];
            let selectedColor = '#6c5ce7';
            let editingId = null;

            // Load from localStorage
            const STORAGE_KEY = 'calendara_events_v2';
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) events = JSON.parse(stored);
            } catch(e) {
                events = [];
            }

            function saveEvents() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
                } catch(e) {}
            }

            // ---- DOM Refs ----
            const $ = (sel) => document.querySelector(sel);
            const $$ = (sel) => document.querySelectorAll(sel);

            const daysGrid = $('#daysGrid');
            const monthTitle = $('#monthTitle');
            const monthYear = $('#monthYear');
            const eventsList = $('#eventsList');
            const modalOverlay = $('#modalOverlay');
            const modalTitle = $('#modalTitle');
            const fabAdd = $('#fabAdd');
            const toast = $('#toast');
            const searchOverlay = $('#searchOverlay');
            const inputSearch = $('#inputSearch');

            // ---- Helpers ----
            function formatDate(d) {
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${y}-${m}-${day}`;
            }

            function dateKey(d) {
                return formatDate(d);
            }

            function parseDate(str) {
                const [y, m, d] = str.split('-').map(Number);
                return new Date(y, m - 1, d);
            }

            function sameDay(a, b) {
                return a.getFullYear() === b.getFullYear() &&
                       a.getMonth() === b.getMonth() &&
                       a.getDate() === b.getDate();
            }

            function getMonthName(m) {
                return ['January','February','March','April','May','June',
                        'July','August','September','October','November','December'][m];
            }

            function getEventsForDate(dateStr) {
                return events.filter(e => e.date === dateStr).sort((a, b) => {
                    if (a.time && b.time) return a.time.localeCompare(b.time);
                    if (a.time) return -1;
                    if (b.time) return 1;
                    return 0;
                });
            }

            function getUpcomingEvents(limit = 6) {
                const today = dateKey(new Date());
                const all = events.filter(e => e.date >= today)
                    .sort((a, b) => {
                        if (a.date !== b.date) return a.date.localeCompare(b.date);
                        if (a.time && b.time) return a.time.localeCompare(b.time);
                        if (a.time) return -1;
                        if (b.time) return 1;
                        return 0;
                    });
                return all.slice(0, limit);
            }

            // ---- Toast ----
            let toastTimer;
            function showToast(msg) {
                clearTimeout(toastTimer);
                toast.textContent = msg;
                toast.classList.add('show');
                toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
            }

            // ---- Render Calendar ----
            function renderCalendar() {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();

                monthTitle.textContent = getMonthName(month);
                monthYear.textContent = year;

                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const totalDays = lastDay.getDate();

                // Monday = 0 ... Sunday = 6
                let startDow = firstDay.getDay(); // 0=Sun
                startDow = startDow === 0 ? 6 : startDow - 1;

                const prevLastDay = new Date(year, month, 0).getDate();
                const today = new Date();
                const todayKey = dateKey(today);
                const selKey = dateKey(selectedDate);

                // Collect event date keys for this month view
                const eventDateCounts = {};
                events.forEach(e => {
                    eventDateCounts[e.date] = (eventDateCounts[e.date] || 0) + 1;
                });

                let html = '';
                let cellCount = 0;
                const totalCells = Math.ceil((startDow + totalDays) / 7) * 7;

                // Previous month days
                for (let i = startDow - 1; i >= 0; i--) {
                    const d = prevLastDay - i;
                    const dt = new Date(year, month - 1, d);
                    const dk = dateKey(dt);
                    const evCount = eventDateCounts[dk] || 0;
                    const isWeekend = dt.getDay() === 0 || dt.getDay() === 6;
                    html += `<div class="day-cell other-month${isWeekend ? ' weekend' : ''}${evCount > 0 ? ' has-event' + (evCount > 1 ? ' has-event-multi' : '') : ''}" data-date="${dk}">${d}</div>`;
                    cellCount++;
                }

                // Current month days
                for (let d = 1; d <= totalDays; d++) {
                    const dt = new Date(year, month, d);
                    const dk = dateKey(dt);
                    const evCount = eventDateCounts[dk] || 0;
                    let cls = 'day-cell';
                    if (dk === todayKey && dk === selKey) cls += ' today selected';
                    else if (dk === todayKey) cls += ' today';
                    else if (dk === selKey) cls += ' selected';
                    if (dt.getDay() === 0 || dt.getDay() === 6) cls += ' weekend';
                    if (evCount > 0) cls += ' has-event' + (evCount > 1 ? ' has-event-multi' : '');
                    html += `<div class="${cls}" data-date="${dk}">${d}</div>`;
                    cellCount++;
                }

                // Next month days
                let nextD = 1;
                while (cellCount < totalCells) {
                    const dt = new Date(year, month + 1, nextD);
                    const dk = dateKey(dt);
                    const evCount = eventDateCounts[dk] || 0;
                    const isWeekend = dt.getDay() === 0 || dt.getDay() === 6;
                    html += `<div class="day-cell other-month${isWeekend ? ' weekend' : ''}${evCount > 0 ? ' has-event' + (evCount > 1 ? ' has-event-multi' : '') : ''}" data-date="${dk}">${nextD}</div>`;
                    nextD++;
                    cellCount++;
                }

                daysGrid.innerHTML = html;

                // Click handlers
                daysGrid.querySelectorAll('.day-cell').forEach(cell => {
                    cell.addEventListener('click', () => {
                        const dk = cell.dataset.date;
                        selectedDate = parseDate(dk);
                        currentDate = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1);
                        renderAll();
                    });
                });
            }

            // ---- Render Agenda / Events List ----
            function renderAgenda() {
                const selKey = dateKey(selectedDate);
                const dayEvents = getEventsForDate(selKey);

                if (currentView === 'agenda') {
                    // Show all upcoming in agenda mode
                    const upcoming = getUpcomingEvents(20);
                    if (upcoming.length === 0) {
                        eventsList.innerHTML = `<div class="no-events"><div class="no-events-icon">📅</div>No upcoming events<br><span style="font-size:0.7rem;">Tap + to add one</span></div>`;
                    } else {
                        eventsList.innerHTML = upcoming.map(e => buildEventCard(e)).join('');
                    }
                } else {
                    // Month view: show selected date events
                    if (dayEvents.length === 0) {
                        const formatted = selectedDate.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
                        eventsList.innerHTML = `<div class="no-events"><div class="no-events-icon">✨</div>No events on ${formatted}<br><span style="font-size:0.7rem;">Tap + to add one</span></div>`;
                    } else {
                        eventsList.innerHTML = dayEvents.map(e => buildEventCard(e)).join('');
                    }
                }

                // Event card click -> edit
                eventsList.querySelectorAll('.event-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const id = card.dataset.eventId;
                        openEditModal(id);
                    });
                });
            }

            function buildEventCard(e) {
                const timeDisplay = e.time ? formatTime12(e.time) : 'All day';
                const descSnippet = e.desc ? `<div class="event-meta">${escapeHTML(e.desc.substring(0, 60))}${e.desc.length > 60 ? '...' : ''}</div>` : '';
                const color = e.color || '#6c5ce7';
                return `
                <div class="event-card" data-event-id="${e.id}">
                    <div class="event-color-dot" style="background:${color};color:${color};"></div>
                    <div class="event-info">
                        <div class="event-title">${escapeHTML(e.title)}</div>
                        <div class="event-time">${timeDisplay}</div>
                        ${descSnippet}
                    </div>
                </div>`;
            }

            function formatTime12(time24) {
                if (!time24) return '';
                const [h, m] = time24.split(':').map(Number);
                const ampm = h >= 12 ? 'PM' : 'AM';
                const h12 = h % 12 || 12;
                return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
            }

            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // ---- Modal ----
            function openAddModal(presetDate) {
                editingId = null;
                $('#inputEditId').value = '';
                modalTitle.textContent = 'New Event';
                $('#inputTitle').value = '';
                $('#inputDate').value = presetDate || dateKey(selectedDate);
                $('#inputTime').value = '09:00';
                $('#inputDesc').value = '';
                selectedColor = '#6c5ce7';
                updateColorPicker();
                $('#btnDelete').style.display = 'none';
                modalOverlay.style.display = 'flex';
                setTimeout(() => $('#inputTitle').focus(), 350);
            }

            function openEditModal(eventId) {
                const e = events.find(ev => ev.id === eventId);
                if (!e) return;
                editingId = eventId;
                $('#inputEditId').value = eventId;
                modalTitle.textContent = 'Edit Event';
                $('#inputTitle').value = e.title;
                $('#inputDate').value = e.date;
                $('#inputTime').value = e.time || '';
                $('#inputDesc').value = e.desc || '';
                selectedColor = e.color || '#6c5ce7';
                updateColorPicker();
                $('#btnDelete').style.display = '';
                modalOverlay.style.display = 'flex';
            }

            function closeModal() {
                modalOverlay.style.display = 'none';
                editingId = null;
                $('#inputEditId').value = '';
            }

            function updateColorPicker() {
                $$('#colorPicker .color-dot').forEach(dot => {
                    dot.classList.toggle('active', dot.dataset.color === selectedColor);
                });
            }

            function saveEvent() {
                const title = $('#inputTitle').value.trim();
                const date = $('#inputDate').value;
                const time = $('#inputTime').value;
                const desc = $('#inputDesc').value.trim();

                if (!title) {
                    showToast('Please enter a title');
                    $('#inputTitle').focus();
                    return;
                }
                if (!date) {
                    showToast('Please select a date');
                    return;
                }

                if (editingId) {
                    const idx = events.findIndex(e => e.id === editingId);
                    if (idx >= 0) {
                        events[idx].title = title;
                        events[idx].date = date;
                        events[idx].time = time;
                        events[idx].desc = desc;
                        events[idx].color = selectedColor;
                    }
                    showToast('Event updated ✓');
                } else {
                    events.push({
                        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                        title,
                        date,
                        time,
                        desc,
                        color: selectedColor,
                    });
                    showToast('Event created ✓');
                }

                saveEvents();
                selectedDate = parseDate(date);
                currentDate = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1);
                closeModal();
                renderAll();
            }

            function deleteEvent() {
                if (!editingId) return;
                events = events.filter(e => e.id !== editingId);
                saveEvents();
                closeModal();
                renderAll();
                showToast('Event deleted');
            }

            // ---- Search ----
            function openSearch() {
                searchOverlay.style.display = 'flex';
                $('#inputSearch').value = '';
                $('#searchResults').innerHTML = '';
                setTimeout(() => $('#inputSearch').focus(), 350);
            }

            function closeSearch() {
                searchOverlay.style.display = 'none';
            }

            function performSearch(query) {
                const q = query.toLowerCase().trim();
                if (!q) {
                    $('#searchResults').innerHTML = '';
                    return;
                }
                const results = events.filter(e =>
                    e.title.toLowerCase().includes(q) ||
                    (e.desc && e.desc.toLowerCase().includes(q))
                ).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 20);

                if (results.length === 0) {
                    $('#searchResults').innerHTML = `<div class="no-events" style="padding:20px;">No results for "${escapeHTML(query)}"</div>`;
                } else {
                    $('#searchResults').innerHTML = results.map(e => {
                        const d = parseDate(e.date);
                        const dateLabel = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
                        return `<div class="event-card" data-event-id="${e.id}" style="cursor:pointer;">
                            <div class="event-color-dot" style="background:${e.color||'#6c5ce7'};color:${e.color||'#6c5ce7'};"></div>
                            <div class="event-info">
                                <div class="event-title">${escapeHTML(e.title)}</div>
                                <div class="event-time">${dateLabel} ${e.time ? '· '+formatTime12(e.time) : ''}</div>
                            </div>
                        </div>`;
                    }).join('');

                    $('#searchResults').querySelectorAll('.event-card').forEach(card => {
                        card.addEventListener('click', () => {
                            const id = card.dataset.eventId;
                            const ev = events.find(e => e.id === id);
                            if (ev) {
                                selectedDate = parseDate(ev.date);
                                currentDate = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1);
                                currentView = 'month';
                                updateViewSwitcher();
                                closeSearch();
                                renderAll();
                            }
                        });
                    });
                }
            }

            // ---- View Switcher ----
            function updateViewSwitcher() {
                $$('#viewSwitcher .view-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.view === currentView);
                });
                if (currentView === 'agenda') {
                    $('#calendarGridWrap').style.display = 'none';
                    $('#agendaSection').querySelector('.section-label').textContent = 'All Upcoming';
                } else {
                    $('#calendarGridWrap').style.display = '';
                    $('#agendaSection').querySelector('.section-label').textContent = 'Upcoming Events';
                }
            }

            // ---- Render All ----
            function renderAll() {
                renderCalendar();
                renderAgenda();
                updateViewSwitcher();
            }

            // ---- Event Listeners ----
            $('#btnPrev').addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() - 1);
                renderAll();
            });
            $('#btnNext').addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() + 1);
                renderAll();
            });
            $('#btnToday').addEventListener('click', () => {
                currentDate = new Date();
                selectedDate = new Date();
                renderAll();
            });

            fabAdd.addEventListener('click', () => openAddModal(dateKey(selectedDate)));

            $('#btnCancel').addEventListener('click', closeModal);
            $('#btnSave').addEventListener('click', saveEvent);
            $('#btnDelete').addEventListener('click', deleteEvent);

            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) closeModal();
            });

            // Color picker
            $('#colorPicker').addEventListener('click', (e) => {
                const dot = e.target.closest('.color-dot');
                if (!dot) return;
                selectedColor = dot.dataset.color;
                updateColorPicker();
            });

            // View switcher
            $('#viewSwitcher').addEventListener('click', (e) => {
                const btn = e.target.closest('.view-btn');
                if (!btn) return;
                currentView = btn.dataset.view;
                renderAll();
            });

            // Search
            $('#btnSearch').addEventListener('click', openSearch);
            searchOverlay.addEventListener('click', (e) => {
                if (e.target === searchOverlay) closeSearch();
            });
            $('#inputSearch').addEventListener('input', (e) => {
                performSearch(e.target.value);
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (modalOverlay.style.display === 'flex') {
                    if (e.key === 'Escape') closeModal();
                    if (e.key === 'Enter' && document.activeElement && document.activeElement.closest('.modal-sheet')) {
                        e.preventDefault();
                        saveEvent();
                    }
                    return;
                }
                if (searchOverlay.style.display === 'flex') {
                    if (e.key === 'Escape') closeSearch();
                    return;
                }
                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    currentDate.setMonth(currentDate.getMonth() - 1);
                    renderAll();
                }
                if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    currentDate.setMonth(currentDate.getMonth() + 1);
                    renderAll();
                }
                if (e.key === 't' && !e.ctrlKey && !e.metaKey && document.activeElement === document.body) {
                    currentDate = new Date();
                    selectedDate = new Date();
                    renderAll();
                }
                if (e.key === 'n' && !e.ctrlKey && !e.metaKey && document.activeElement === document.body) {
                    e.preventDefault();
                    openAddModal(dateKey(selectedDate));
                }
                if (e.key === '/' && !e.ctrlKey && !e.metaKey && document.activeElement === document.body) {
                    e.preventDefault();
                    openSearch();
                }
            });

            // Swipe support for mobile month navigation
            let touchStartX = 0;
            let touchStartY = 0;
            const calendarGridWrap = $('#calendarGridWrap');
            calendarGridWrap.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }, { passive: true });
            calendarGridWrap.addEventListener('touchend', (e) => {
                const dx = e.changedTouches[0].clientX - touchStartX;
                const dy = e.changedTouches[0].clientY - touchStartY;
                if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 60) {
                    if (dx > 0) {
                        currentDate.setMonth(currentDate.getMonth() - 1);
                    } else {
                        currentDate.setMonth(currentDate.getMonth() + 1);
                    }
                    renderAll();
                }
            });

            // ---- Init ----
            selectedDate = new Date();
            currentDate = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1);
            renderAll();
        })();
    </script>
</body>
</html>
